[workspace]
resolver = "2"
members = [
    "tpt-l-landlock-highlevel",
    "tpt-l-seccomp-builder",
    "tpt-l-namespaces-rs",
    "tpt-l-cgroup-v2",
    "tpt-l-caps-drop",
    "tpt-l-chroot-jail",
    "tpt-l-apparmor-parser",
    "tpt-l-selinux-context",
    "tpt-l-audit-logger",
    "tpt-l-sandbox",
    "tpt-l-sandbox-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TPT-Solutions/tpt-linux-sandbox"
authors = ["TPT Solutions"]
keywords = ["sandbox", "landlock", "seccomp", "linux", "security"]
categories = ["os::linux-apis", "security"]

[workspace.dependencies]
# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# CLI
clap = { version = ">=4.5,<4.5.45", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Parsing
nom = ">=7,<8"

# System bindings
libc = "0.2"

# Capability handling
caps = "0.5"

# Landlock official crate
landlock = ">=0.3,<0.5"

# Seccomp BPF generation
seccompiler = ">=0.3,<0.5"

# Bitflags
bitflags = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
