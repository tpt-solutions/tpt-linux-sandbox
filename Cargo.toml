[workspace]
members = [
    "crates/tpt-l-landlock-highlevel",
    "crates/tpt-l-seccomp-builder",
    "crates/tpt-l-namespaces-rs",
    "crates/tpt-l-cgroup-v2",
    "crates/tpt-l-caps-drop",
    "crates/tpt-l-chroot-jail",
    "crates/tpt-l-apparmor-parser",
    "crates/tpt-l-selinux-context",
    "crates/tpt-l-audit-logger",
    "crates/tpt-l-sandbox",
    "crates/tpt-l-sandbox-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["TPT Solutions <phillip@icb.co.nz>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TPT-Solutions/tpt-linux-sandbox"
homepage = "https://github.com/TPT-Solutions/tpt-linux-sandbox"

[workspace.dependencies]
# Sandboxing primitives
landlock = "0.4"
seccompiler = "0.4"
caps = "0.5"
nix = { version = "0.29", features = ["user", "fs", "mount", "process", "signal"] }
libc = "0.2"
# Async
tokio = { version = "1", features = ["full"] }
# Error handling
thiserror = "2"
anyhow = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# Parsing
nom = "7"
# Workspace members
tpt-l-landlock-highlevel = { path = "crates/tpt-l-landlock-highlevel" }
tpt-l-seccomp-builder    = { path = "crates/tpt-l-seccomp-builder" }
tpt-l-namespaces-rs      = { path = "crates/tpt-l-namespaces-rs" }
tpt-l-cgroup-v2          = { path = "crates/tpt-l-cgroup-v2" }
tpt-l-caps-drop          = { path = "crates/tpt-l-caps-drop" }
tpt-l-chroot-jail        = { path = "crates/tpt-l-chroot-jail" }
tpt-l-apparmor-parser    = { path = "crates/tpt-l-apparmor-parser" }
tpt-l-selinux-context    = { path = "crates/tpt-l-selinux-context" }
tpt-l-audit-logger       = { path = "crates/tpt-l-audit-logger" }
tpt-l-sandbox            = { path = "crates/tpt-l-sandbox" }
