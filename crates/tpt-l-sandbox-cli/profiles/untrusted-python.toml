# Untrusted Python: read system libraries, no network, no caps.
# Same baseline as untrusted-node; kept as a separate file so each can diverge.
allow_read = ["/etc/localtime", "/usr/share/zoneinfo"]
no_network = true
drop_caps = true
seccomp = "enforce"
# Resource limits are not set here: they need cgroup delegation. Add
# --memory-limit / --pids-limit, or set memory_limit / pids_limit in a policy file.
