# Outbound network client: TLS roots and name resolution, no writes.
allow_read = ["/etc/ssl", "/etc/resolv.conf", "/etc/hosts", "/etc/nsswitch.conf", "/etc/host.conf", "/usr/share/ca-certificates"]
drop_caps = true
seccomp = "enforce"
# Resource limits are not set here: they need cgroup delegation. Add
# --memory-limit / --pids-limit, or set memory_limit / pids_limit in a policy file.
