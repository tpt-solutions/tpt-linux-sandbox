# Debian package maintainer scripts (postinst, prerm and similar).
# Reads the system, writes only the package database, no network, no caps.
allow_read = ["/etc", "/usr", "/var/lib/dpkg"]
allow_write = ["/var/lib/dpkg", "/etc"]
no_network = true
drop_caps = true
seccomp = "enforce"
cwd = "/"
# Resource limits are not set here: they need cgroup delegation. Add
# --memory-limit / --pids-limit, or set memory_limit / pids_limit in a policy file.
