# Build tools: toolchain read access, current directory writable, network on
# (dependency fetches). Run from the project root.
allow_read = ["/etc", "/usr/share", "/usr/include", "/usr/lib"]
allow_write = ["."]
seccomp = "enforce"
# Resource limits are not set here: they need cgroup delegation. Add
# --memory-limit / --pids-limit, or set memory_limit / pids_limit in a policy file.
