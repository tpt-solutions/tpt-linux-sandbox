[package]
name = "tpt-l-sandbox-cli"
version = "0.1.0"
description = "Pure-Rust sandboxed command runner — composable alternative to bwrap and firejail"
readme = "README.md"
keywords = ["sandbox", "bwrap", "firejail", "linux", "security"]
categories = ["command-line-utilities", "os::linux-apis"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "tpt-sandbox"
path = "src/main.rs"

[dependencies]
tpt-l-sandbox.workspace = true
tpt-l-apparmor-parser.workspace = true
tpt-l-selinux-context.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
toml.workspace = true

# `cargo binstall tpt-l-sandbox-cli` downloads a prebuilt binary from the
# GitHub release created by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tpt-sandbox-{ target }.tar.gz"
bin-dir = "tpt-sandbox-{ target }/tpt-sandbox"
pkg-fmt = "tgz"

# `cargo deb` builds a Debian package. Profiles are installed as examples.
[package.metadata.deb]
name = "tpt-sandbox"
section = "utils"
priority = "optional"
assets = [
    ["target/release/tpt-sandbox", "usr/bin/", "755"],
    ["profiles/*.toml", "usr/share/tpt-sandbox/profiles/", "644"],
    ["README.md", "usr/share/doc/tpt-sandbox/", "644"],
]
